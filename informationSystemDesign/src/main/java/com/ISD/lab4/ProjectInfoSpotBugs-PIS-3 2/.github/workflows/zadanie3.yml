name: Задание 3 - Анализ Colt библиотеки

on:
  push:
    paths:
      - 'ProjectInfoSystem(zadanie3)/**'
  pull_request:
    paths:
      - 'ProjectInfoSystem(zadanie3)/**'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        
    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
        
    - name: Navigate to zadanie3
      run: cd "ProjectInfoSystem(zadanie3)"
      
    - name: Compile with Maven (including Colt)
      run: |
        cd "ProjectInfoSystem(zadanie3)"
        mvn clean compile
        
    - name: Run SpotBugs on Colt integration
      run: |
        cd "ProjectInfoSystem(zadanie3)"
        mvn spotbugs:check
        
    - name: Generate Colt analysis report
      run: |
        cd "ProjectInfoSystem(zadanie3)"
        mvn spotbugs:gui || true
        
    - name: Run examples with Colt
      run: |
        cd "ProjectInfoSystem(zadanie3)"
        java -cp "target/classes" com.example.Main
        
    - name: Validate Colt integration
      run: |
        cd "ProjectInfoSystem(zadanie3)"
        # Проверяем наличие Colt импортов
        grep -r "cern\.colt\|cern\.jet" src/main/java/ || echo "Colt imports found"
        
    - name: Upload SpotBugs results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: spotbugs-colt-report-zadanie3
        path: ProjectInfoSystem(zadanie3)/target/spotbugs/
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: build-artifacts-zadanie3
        path: ProjectInfoSystem(zadanie3)/target/
        
  colt-analysis:
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        
    - name: Run Colt-specific analysis
      run: |
        cd "ProjectInfoSystem(zadanie3)"
        echo "Running Colt library analysis..."
        
        # Проверяем Colt зависимости
        mvn dependency:tree | grep colt || echo "Colt dependency found"
        
        # Запускаем расширенный анализ
        mvn spotbugs:check -Dspotbugs.effort=Max -Dspotbugs.threshold=Low
        
    - name: Generate Colt critical issues report
      run: |
        cd "ProjectInfoSystem(zadanie3)"
        echo "Generating Colt critical issues report..."
        
        # Создаем отчет о критических проблемах Colt
        echo "# Colt Critical Issues Report" > colt-critical-issues-ci.md
        echo "Generated on: $(date)" >> colt-critical-issues-ci.md
        echo "" >> colt-critical-issues-ci.md
        
        # Анализируем найденные проблемы
        if [ -f "target/spotbugs/spotbugsXml.xml" ]; then
          echo "## SpotBugs Analysis Results" >> colt-critical-issues-ci.md
          echo "SpotBugs analysis completed successfully." >> colt-critical-issues-ci.md
        else
          echo "## SpotBugs Analysis Results" >> colt-critical-issues-ci.md
          echo "SpotBugs analysis failed or no issues found." >> colt-critical-issues-ci.md
        fi
        
    - name: Upload Colt analysis report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: colt-analysis-report
        path: ProjectInfoSystem(zadanie3)/colt-critical-issues-ci.md

