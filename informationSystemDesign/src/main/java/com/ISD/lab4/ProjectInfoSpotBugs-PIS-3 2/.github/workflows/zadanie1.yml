name: Задание 1 - Базовые примеры статического анализа

on:
  push:
    paths:
      - 'ProjectInfoSystem(zadanie1)/**'
  pull_request:
    paths:
      - 'ProjectInfoSystem(zadanie1)/**'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        
    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
        
    - name: Compile with Maven
      run: |
        cd "ProjectInfoSystem(zadanie1)"
        mvn clean compile
        
    - name: Run SpotBugs static analysis
      run: |
        cd "ProjectInfoSystem(zadanie1)"
        mvn spotbugs:check
        
    - name: Generate SpotBugs report
      run: |
        cd "ProjectInfoSystem(zadanie1)"
        mvn spotbugs:gui || true
        
    - name: Run examples
      run: |
        cd "ProjectInfoSystem(zadanie1)"
        java -cp "target/classes" com.example.Main
        
    - name: Upload SpotBugs results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: spotbugs-report-zadanie1
        path: ProjectInfoSystem(zadanie1)/target/spotbugs/
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: build-artifacts-zadanie1
        path: ProjectInfoSystem(zadanie1)/target/