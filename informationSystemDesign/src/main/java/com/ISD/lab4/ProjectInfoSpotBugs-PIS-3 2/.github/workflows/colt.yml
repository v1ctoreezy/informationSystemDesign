name: Colt - Анализ библиотеки Colt

on:
  push:
    paths:
      - 'colt/**'
  pull_request:
    paths:
      - 'colt/**'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        
    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
        
    - name: Compile Colt with Maven
      run: |
        cd colt
        mvn clean compile
        
    - name: Run SpotBugs on Colt
      run: |
        cd colt
        mvn spotbugs:check
        
    - name: Generate Colt analysis report
      run: |
        cd colt
        mvn spotbugs:gui || true
        
    - name: Run Colt tests
      run: |
        cd colt
        # Запускаем тесты если есть
        mvn test || echo "No tests found"
        
    - name: Generate Colt documentation
      run: |
        cd colt
        mvn javadoc:javadoc || echo "Javadoc generation failed"
        
    - name: Upload SpotBugs results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: spotbugs-report-colt
        path: colt/target/spotbugs/
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: build-artifacts-colt
        path: colt/target/
        
    - name: Upload documentation
      uses: actions/upload-artifact@v3
      with:
        name: colt-documentation
        path: colt/target/site/
